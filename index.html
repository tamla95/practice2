<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학교시설공사 매뉴얼 AI 챗봇</title></head><body><div style="font-family:sans-serif;padding:40px">학교시설공사 AI 챗봇을 불러오는 중...</div><script>(async()=>{try{const ps=await Promise.all([1,2,3,4].map(n=>fetch(`parts/part0${n}.txt`).then(r=>{if(!r.ok)throw new Error(`part0${n} 로드 실패`);return r.text()})));let s=ps.join('');const marker=',"raw_text_lines":[';const i=s.indexOf(marker);if(i<0)throw new Error('매뉴얼 데이터 경계를 찾지 못했습니다.');const closeScript='</scr'+'ipt>';const openApp='<scr'+'ipt src="app.js"></scr'+'ipt>';s=s.slice(0,i)+'}'+closeScript+openApp+'</body></html>';document.open();document.write(s);document.close();}catch(e){document.body.innerHTML='<pre style="padding:30px;color:#b91c1c">로드 실패: '+String(e.message||e)+'</pre>';}})();</script></body></html>
